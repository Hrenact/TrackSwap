name: v002 build

on:
  push:
    branches:
      - v002-runtime
    tags:
      - v[0-9][0-9][0-9]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build managed projects
        run: dotnet build TrackSwap.sln -c Release

      - name: Test protocol
        run: dotnet test tests/TrackSwap.Protocol.Tests/TrackSwap.Protocol.Tests.csproj -c Release --no-build

      - name: Test runtime
        run: dotnet test tests/TrackSwap.Runtime.Tests/TrackSwap.Runtime.Tests.csproj -c Release

      - name: Configure native driver
        run: cmake -S src/TrackSwap.Driver -B artifacts/build/driver -A x64

      - name: Build native driver
        run: cmake --build artifacts/build/driver --config Release

      - name: Test native pose conversion
        run: ctest --test-dir artifacts/build/driver -C Release --output-on-failure

      - name: Package native driver
        run: cmake --install artifacts/build/driver --config Release --prefix artifacts/driver/trackswap

      - name: Build complete release package
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'v002' }
          .\scripts\Build-Release.ps1 -Version $version

      - name: Upload Windows x64 package
        uses: actions/upload-artifact@v4
        with:
          name: TrackSwap-v002-win-x64
          path: |
            artifacts/release/*/*.zip
            artifacts/release/*/*.sha256

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem artifacts/release/$env:GITHUB_REF_NAME/*.zip | Select-Object -First 1
          $sha = Get-ChildItem artifacts/release/$env:GITHUB_REF_NAME/*.sha256 | Select-Object -First 1
          gh release create $env:GITHUB_REF_NAME $zip.FullName $sha.FullName --title $env:GITHUB_REF_NAME --generate-notes
