name: Build and release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate version tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v\d{3}$') {
            throw "Release tags must use the vNNN format, for example v001."
          }

          [xml]$project = Get-Content "src/TrackSwap/TrackSwap.csproj"
          $projectVersion = $project.Project.PropertyGroup.InformationalVersion
          if ($projectVersion -ne $tag) {
            throw "Tag $tag does not match project version $projectVersion."
          }

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build complete release package
        shell: pwsh
        run: |
          .\scripts\Build-Release.ps1 -Version "${{ github.ref_name }}"

      - name: Upload release artifact
        uses: actions/upload-artifact@v6
        with:
          name: TrackSwap-${{ github.ref_name }}-win-x64
          path: |
            artifacts/release/${{ github.ref_name }}/*.zip
            artifacts/release/${{ github.ref_name }}/*.sha256

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem "artifacts/release/${{ github.ref_name }}/*.zip" | Select-Object -First 1
          $checksum = Get-ChildItem "artifacts/release/${{ github.ref_name }}/*.sha256" | Select-Object -First 1
          $notes = "docs/releases/${{ github.ref_name }}.md"
          $arguments = @(
            "release", "create", "${{ github.ref_name }}",
            $zip.FullName, $checksum.FullName,
            "--title", "TrackSwap ${{ github.ref_name }}"
          )
          if (Test-Path -LiteralPath $notes) {
            $arguments += @("--notes-file", $notes)
          } else {
            $arguments += "--generate-notes"
          }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release creation failed with exit code $LASTEXITCODE."
          }
