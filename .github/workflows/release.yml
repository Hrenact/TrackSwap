name: Build and release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate version tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v\d{3}$') {
            throw "Release tags must use the vNNN format, for example v001."
          }

          [xml]$project = Get-Content "src/TrackSwap/TrackSwap.csproj"
          $projectVersion = $project.Project.PropertyGroup.InformationalVersion
          if ($projectVersion -ne $tag) {
            throw "Tag $tag does not match project version $projectVersion."
          }

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Audit third-party notices
        shell: pwsh
        run: .\scripts\Test-ThirdPartyNotices.ps1

      - name: Build complete release package and installer
        shell: pwsh
        run: |
          .\scripts\Build-Installer.ps1 -Version "${{ github.ref_name }}"

      - name: Upload release artifact
        uses: actions/upload-artifact@v6
        with:
          name: TrackSwap-${{ github.ref_name }}-win-x64
          path: |
            artifacts/release/${{ github.ref_name }}/*.zip
            artifacts/release/${{ github.ref_name }}/*.exe
            artifacts/release/${{ github.ref_name }}/*.sha256

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = Get-ChildItem "artifacts/release/${{ github.ref_name }}/*.zip" | Select-Object -First 1
          $zipChecksum = Get-Item "$($zip.FullName).sha256"
          $installer = Get-ChildItem "artifacts/release/${{ github.ref_name }}/*-setup-win-x64.exe" | Select-Object -First 1
          $installerChecksum = Get-Item "$($installer.FullName).sha256"
          $assets = @(
            $zip.FullName, $zipChecksum.FullName,
            $installer.FullName, $installerChecksum.FullName
          )
          $notes = "docs/releases/$tag.md"
          $title = "TrackSwap VR $tag"

          & gh release view $tag --json tagName *> $null
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
            $editArguments = @("release", "edit", $tag, "--title", $title, "--latest")
            if (Test-Path -LiteralPath $notes) {
              $editArguments += @("--notes-file", $notes)
            }
            & gh @editArguments
            if ($LASTEXITCODE -ne 0) {
              throw "GitHub Release update failed with exit code $LASTEXITCODE."
            }

            & gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "GitHub Release asset upload failed with exit code $LASTEXITCODE."
            }
          } else {
            $createArguments = @(
              "release", "create", $tag,
              $assets,
              "--title", $title,
              "--verify-tag",
              "--latest"
            )
            if (Test-Path -LiteralPath $notes) {
              $createArguments += @("--notes-file", $notes)
            } else {
              $createArguments += "--generate-notes"
            }
            & gh @createArguments
            if ($LASTEXITCODE -ne 0) {
              throw "GitHub Release creation failed with exit code $LASTEXITCODE."
            }
          }
